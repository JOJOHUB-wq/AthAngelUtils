# Збірка готового jar на інфраструктурі GitHub (у песочниці мережа обмежена білими
# списками, тому Maven/Gradle-залежності та Loom тягне раннер GitHub, а не пісочниця).
# Після успішної збірки jar комітиться в dist/ (з [skip ci], щоб не зациклитись) і
# додається як артефакт рану.
name: build-jar

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0925e-athangelutils, main]

concurrency:
  group: build-jar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: athagnelutils-jar
          path: build/libs/*.jar

      - name: Commit jar to dist/
        run: |
          mkdir -p dist
          cp build/libs/athagnelutils-*.jar dist/ 2>/dev/null || true
          if [ -n "$(git status --porcelain dist/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/
            git commit -m "chore: оновлено зібраний jar [skip ci]"
            git push
          else
            echo "jar unchanged"
          fi
